name: Viral Shorts automation

on:
  schedule:
    # 09:00 / 14:00 / 20:00 Paris (CET) ≈ 08 / 13 / 19 UTC
    - cron: "0 8,13,19 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "seed | generate | run | seed-week"
        required: false
        default: "run"

jobs:
  viral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Seed + generate viral Short
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VIRAL_ACE_DURATION_SEC: "32"
          YOUTUBE_VIRAL_PREVIEW_SEC: "18"
        run: node scripts/viral-content-run.mjs "${{ github.event.inputs.action || 'run' }}"
