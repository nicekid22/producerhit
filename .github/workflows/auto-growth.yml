name: Auto growth sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync SEO sitemaps
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npm run generate:seo

      - name: Commit and push
        run: |
          git config user.name "producerhit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/sitemap.xml public/sitemap-loops.xml public/sitemap-blog.xml public/sitemap-index.xml public/rss.xml public/rss-tracks.xml public/robots.txt public/seo-prerender.json public/producerhit-indexnow-key.txt
          git diff --staged --quiet || git commit -m "Growth: sync SEO sitemaps, RSS and IndexNow"
          git push
