name: Automation report

on:
  schedule:
    # Réduit à 1x/day sur Nano free (au lieu de 2x).
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate automation report
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOMATION_REPORT_WEBHOOK: ${{ secrets.AUTOMATION_REPORT_WEBHOOK }}
          OPENCLAW_REPORT_WEBHOOK: ${{ secrets.OPENCLAW_REPORT_WEBHOOK }}
        run: node scripts/automation-report.mjs
