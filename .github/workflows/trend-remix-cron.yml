name: Trend remix YouTube (landscape)

on:
  schedule:
    # 10:00 + 18:00 Paris ≈ 09 + 17 UTC
    - cron: "0 9,17 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "seed | generate | run | seed-week"
        required: false
        default: "run"

jobs:
  trend-remix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate trend remix + landscape video
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TREND_REMIX_DURATION_SEC: "90"
          TREND_REMIX_MAX_SEC: "120"
        run: node scripts/trend-remix-run.mjs "${{ github.event.inputs.action || 'run' }}"
