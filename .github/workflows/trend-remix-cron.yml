name: Trend remix YouTube (landscape)

on:
  schedule:
    # Trend remix YouTube — gardé actif (cron YouTube récent)
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "run | run-all | seed | seed-week"
        required: false
        default: "run"

jobs:
  trend-remix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Trend remix generate + YouTube publish
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOCIAL_PUBLISH_CRON_SECRET: ${{ secrets.SOCIAL_PUBLISH_CRON_SECRET }}
          TREND_REMIX_AUTO_PUBLISH: "1"
          TREND_REMIX_LANDSCAPE_THEME: "cinematic-glow"
          TREND_REMIX_DURATION_SEC: "90"
          TREND_REMIX_MAX_SEC: "600"
          TREND_REMIX_DAILY_SLOTS: "4"
        run: node scripts/trend-remix-run.mjs "${{ github.event.inputs.action || 'run' }}"
