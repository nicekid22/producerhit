name: YouTube daily (49 videos)

on:
  schedule:
    # Every 2h UTC — throttling spreads ~49 uploads across the day
    - cron: "0 6,8,10,12,14,16,18,20,22 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "seed | run | run-all | catch-up | repair | seed-week"
        required: false
        default: "catch-up"

jobs:
  youtube-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: YouTube daily plans (community + remix shorts)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOCIAL_PUBLISH_CRON_SECRET: ${{ secrets.SOCIAL_PUBLISH_CRON_SECRET }}
          YOUTUBE_PREVIEW_SEC: "45"
          YOUTUBE_MAX_DAILY_PER_ACCOUNT: "7"
          YOUTUBE_DAILY_AUTO_PUBLISH: "1"
          COMMUNITY_YOUTUBE_AUTO_PUBLISH: "1"
          YOUTUBE_DAILY_BATCH: "5"
          YOUTUBE_DAILY_CATCHUP_BATCHES: "3"
          COMMUNITY_LANDSCAPE_PINTEREST_VIDEO: "1"
          TREND_REMIX_LANDSCAPE_THEME: "cinematic-glow"
        run: |
          node scripts/youtube-daily-run.mjs repair
          node scripts/youtube-daily-run.mjs "${{ github.event.inputs.action || 'catch-up' }}"
