name: Social publish cron

on:
  # DÉSACTIVÉ — ancien cron marketing. Garder les 3 crons YouTube actifs uniquement.
  # schedule:
  #   - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (ffmpeg render)
        run: npm ci

      - name: Pre-render YouTube Shorts for queue
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_VIRAL_VISUAL: cover
          YOUTUBE_COMMUNITY_TEMPLATE: player
          YOUTUBE_PREVIEW_SEC: "15"
        run: node scripts/youtube-prerender-queue.mjs
        continue-on-error: true

      - name: Process social publish queue
        env:
          SOCIAL_PUBLISH_CRON_SECRET: ${{ secrets.SOCIAL_PUBLISH_CRON_SECRET }}
        run: |
          if [ -z "$SOCIAL_PUBLISH_CRON_SECRET" ]; then
            echo "Missing GitHub secret SOCIAL_PUBLISH_CRON_SECRET"
            exit 1
          fi
          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/social-cron.json -X POST \
            "https://pmfnzenqemnonpglmjqx.supabase.co/functions/v1/social-publish-cron" \
            -H "Content-Type: application/json" \
            -H "x-social-cron-secret: ${SOCIAL_PUBLISH_CRON_SECRET}" \
            -d '{"action":"process_queue","limit":1}')
          cat /tmp/social-cron.json
          if [ "$HTTP" != "200" ]; then
            echo "social-publish-cron HTTP $HTTP"
            exit 1
          fi

      - name: Generate rss-tracks.xml
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/sync-rss-tracks.mjs

      - name: Commit RSS tracks feed
        run: |
          git config user.name "producerhit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/rss-tracks.xml public/robots.txt
          git diff --staged --quiet || git commit -m "Growth: sync public tracks RSS"
          git push || true
