# Supabase Edge Functions — JWT verification
# stripe-webhook must accept unsigned Stripe POST requests.

# Auth — inscription immédiate sans confirmation email (local + doc prod)
[auth.email]
enable_signup = true
enable_confirmations = false

[functions.stripe-webhook]
verify_jwt = false

# stream_public : lecture <audio> sans Bearer (communauté publique)
[functions.generate-loop-ace]
verify_jwt = false

# Purge loop-audio > 7j (cron : header x-cron-secret ou service role)
[functions.purge-loop-audio]
verify_jwt = false

[functions.persist-pinterest-cover]
verify_jwt = true

[functions.fetch-pinterest-cover]
verify_jwt = false

[functions.producer-tag]
verify_jwt = true

[functions.apply-producer-tag]
verify_jwt = true

# Discord — webhooks sans JWT Supabase (signature Discord / cron secret)
[functions.discord-interactions]
verify_jwt = false

[functions.discord-cron]
verify_jwt = false

[functions.social-publish-cron]
verify_jwt = false
