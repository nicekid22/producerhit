    <style id="pk-boot-surface">
      html,
      body {
        background: #121214;
      }
    </style>
    <script>
      (function () {
        var bootBgs = {
          prism: "#121214",
          "warm-glass": "#1a1210",
          cloud: {
            transparent: "#e8d8f0",
            green: "#dcecc8",
            red: "#f0d8cc",
            blue: "#d0e8f8",
          },
        };
        var bg = bootBgs.prism;
        try {
          var theme = localStorage.getItem("producerhit_visual_theme_v1");
          var accent = localStorage.getItem("producerhit_cloud_accent_v1") || "transparent";
          var html = document.documentElement;
          var style = document.getElementById("pk-boot-surface");
          if (theme === "cloud" && bootBgs.cloud[accent]) {
            bg = bootBgs.cloud[accent];
            html.setAttribute("data-pk-boot-theme", "cloud");
            html.setAttribute("data-pk-cloud-accent", accent);
            html.classList.add("pk-boot-cloud");
            var tc = document.querySelector('meta[name="theme-color"]');
            if (tc) tc.setAttribute("content", bg);
            var tile = document.querySelector('meta[name="msapplication-TileColor"]');
            if (tile) tile.setAttribute("content", bg);
            var cs = document.querySelector('meta[name="color-scheme"]');
            if (cs) cs.setAttribute("content", "light");
            var fav = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
            if (fav) fav.setAttribute("href", "/favicon-cloud-" + accent + ".svg");
            var png = document.querySelector('link[rel="icon"][type="image/png"]');
            if (png) png.setAttribute("href", "/favicon-cloud-" + accent + "-32.png");
            var apple = document.querySelector('link[rel="apple-touch-icon"]');
            if (apple) apple.setAttribute("href", "/apple-touch-icon-cloud-" + accent + ".png");
          } else if (theme === "warm-glass") {
            bg = bootBgs["warm-glass"];
            html.setAttribute("data-pk-boot-theme", "warm-glass");
            html.classList.add("pk-boot-warm");
            var tcW = document.querySelector('meta[name="theme-color"]');
            if (tcW) tcW.setAttribute("content", "#963848");
            var favW = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
            if (favW) favW.setAttribute("href", "/favicon-warm.svg");
          } else {
            html.setAttribute("data-pk-boot-theme", "prism");
          }
          if (style) {
            style.textContent =
              "html,body{background:" +
              bg +
              " !important;color-scheme:" +
              (theme === "cloud" ? "light" : "dark") +
              ";}";
          }
        } catch (e) {}
      })();
    </script>
