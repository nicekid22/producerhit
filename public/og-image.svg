<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0f" />
  <circle cx="600" cy="315" r="360" fill="url(#glow)" filter="url(#soft)" />
  <circle cx="860" cy="220" r="220" fill="url(#glow)" filter="url(#soft)" opacity="0.7" />

  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <text x="110" y="300" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-1">
      producer<tspan fill="#7c3aed">hit</tspan>
    </text>
    <text x="110" y="365" font-size="40" font-weight="700" fill="url(#accent)">
      AI Beat &amp; Song Generator
    </text>
    <text x="110" y="418" font-size="22" font-weight="600" fill="#9ca3af">
      Generate professional music in seconds
    </text>
  </g>
</svg>
